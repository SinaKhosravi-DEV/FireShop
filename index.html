    <link rel="icon" type="image/webp" href="public/icon.webp" />

            <p class="font-bold text-[14px]">01-234-567</p>
            <p class="text-[11px]">24h Support</p>
          </div>
        </div>
      </section>
    </header>

    <main class="pt-5 max-w-87 mx-auto">
      <section class="relative">
        <img src="public/banner.jpg" alt="banner" class="rounded-3xl">
        <div class="absolute top-3 right-2 grid gap-1.5">
          <p class="bg-[#383838] w-fit px-6.75 py-1 rounded-lg text-white">Best Price</p>
          <p class="bg-[#383838] w-fit px-5 py-1 rounded-lg text-white text-[15px]">High Quality</p>
        </div>
        <div class="text-[#000000] absolute bottom-3 left-2">
          <p class="text-[14px] font-bold">With the best <span class="text-white">support</span></p>
          <p class="text-[13px]">The biggest store in the country</p>
        </div>
      </section>
      <section class="flex justify-between items-center pt-13 pb-20">
        <div class="grid gap-2 place-items-center bg-white px-3 py-4  rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" d="M7.33 10.846a4.5 4.5 0 0 1-2.663.266C3.07 10.777 2 9.717 2 8.056V6.129C2 4.122 3.526 2.98 5.556 3C7.81 3.023 10.5 4.764 10.5 7.507v11.91c0 .544 0 .816-.103 1.025c-.29.588-.911.558-1.48.558c-.57 0-1.19.03-1.48-.558c-.104-.209-.104-.481-.104-1.025v-8.312q0-.133-.003-.259Zm0 0l.003-.001m-.003.001C7.297 9.682 7 8.5 6 8.5m10.67 2.346a4.5 4.5 0 0 0 2.663.266C20.93 10.777 22 9.717 22 8.056V6.129C22 4.124 20.387 2.98 18.444 3C16.19 3.023 13.5 4.764 13.5 7.507v11.91c0 .544 0 .816.103 1.025c.29.588.911.558 1.48.558c.57 0 1.19.03 1.48-.558c.104-.209.104-.481.104-1.025v-8.312q0-.133.003-.259Zm0 0l-.003-.001m.003.001C16.703 9.682 17 8.5 18 8.5"/></svg>
          <p>Accessories</p>
        </div>
        <div class="grid gap-2 place-items-center bg-white px-5 py-4  rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M4 19q-.825 0-1.412-.587T2 17V7q0-.825.588-1.412T4 5h16q.825 0 1.413.588T22 7v10q0 .825-.587 1.413T20 19zm0-2h16V7H4zm5-1h6q.425 0 .713-.288T16 15t-.288-.712T15 14H9q-.425 0-.712.288T8 15t.288.713T9 16m-5 1V7zm2-7q.425 0 .713-.288T7 9t-.288-.712T6 8t-.712.288T5 9t.288.713T6 10m3 0q.425 0 .713-.288T10 9t-.288-.712T9 8t-.712.288T8 9t.288.713T9 10m3 0q.425 0 .713-.288T13 9t-.288-.712T12 8t-.712.288T11 9t.288.713T12 10m3 0q.425 0 .713-.288T16 9t-.288-.712T15 8t-.712.288T14 9t.288.713T15 10m3 0q.425 0 .713-.288T19 9t-.288-.712T18 8t-.712.288T17 9t.288.713T18 10M6 13q.425 0 .713-.288T7 12t-.288-.712T6 11t-.712.288T5 12t.288.713T6 13m3 0q.425 0 .713-.288T10 12t-.288-.712T9 11t-.712.288T8 12t.288.713T9 13m3 0q.425 0 .713-.288T13 12t-.288-.712T12 11t-.712.288T11 12t.288.713T12 13m3 0q.425 0 .713-.288T16 12t-.288-.712T15 11t-.712.288T14 12t.288.713T15 13m3 0q.425 0 .713-.288T19 12t-.288-.712T18 11t-.712.288T17 12t.288.713T18 13"/></svg>

        </div>
        <div class="grid gap-2 place-items-center bg-white px-3 py-4  rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="m9 22l-1.35-4.55q-1.2-.95-1.925-2.375T5 12t.725-3.075T7.65 6.55L9 2h6l1.35 4.55q1.2.95 1.925 2.375T19 12t-.725 3.075t-1.925 2.375L15 22zm3-5q2.075 0 3.538-1.463T17 12t-1.463-3.537T12 7T8.463 8.463T7 12t1.463 3.538T12 17"/></svg>

      <section class="bg-[#052137] flex justify-between items-center mb-40 px-3 pt-4 pb-8 rounded-2xl">
        <div class="bg-white rounded-lg place-items-center px-2.25 pb-7">
          <img src="public/headphone.jpeg" alt="headphone" class="w-22 rounded-lg">
          <p class="text-gray-600 text-[15px] pt-4">Wireless Headphone</p>
          <div class="flex justify-between w-full pt-3">
            <div>
              <p class="font-bold text-[18px]">$499</p>
              <p class="line-through">$699</p>
            </div>
            <p class="bg-[#1212DA] h-fit rounded-full px-2 text-[13px] mt-3 text-white">4%</p>
          </div>
        </div>
        <div class="bg-white rounded-lg place-items-center px-2.25 pb-7">
          <img src="public/laptop.avif" alt="laptop" class="w-36 rounded-lg">
          <p class="text-gray-600 text-[15px] pt-4">Ai Laptop</p>
          <div class="flex justify-between w-full pt-3">
            <div>
              <p class="font-bold text-[18px]">$1199</p>
              <p class="line-through">$1499</p>
            </div>
            <p class="bg-[#1212DA] h-fit rounded-full px-2 text-[13px] mt-3 text-white">16%</p>
          </div>
        </div>
      </section>

</html>
